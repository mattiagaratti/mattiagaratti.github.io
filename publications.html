<body class="is-preload publications">

    <div id="page-wrapper">

        <header id="header">
            <h1><a href="index.html">Mattia Garatti</a></h1>

            </div>

        <section id="banner">
            <header>
                <div class="inner">
                    <h2>Publications</h2>
                </div>
            </header>
        </section>

        <div class="wrapper">
            <div class="inner">
                <div id="publications-list"></div>
            </div>
        </div>

        <div id="pubModal" class="modal">
            <div class="modal-content">
                <div id="modal-body">
                    </div>
            </div>
        </div>

        <footer id="footer">
            <div class="inner">

                    <li>&copy; Mattia Garatti | All rights reserved.</li>
                </ul>
            </div>

    </div>

    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/jquery.scrollex.min.js"></script>
    <script src="assets/js/browser.min.js"></script>
    <script src="assets/js/breakpoints.min.js"></script>
    <script src="assets/js/util.js"></script>
    <script src="assets/js/main.js"></script>

    <script>
    // Inizializziamo la variabile globale
    let pubData = [];

    async function initPublications() {
        try {
            // Carichiamo il file JSON esterno
            const response = await fetch('./publications.json');
            if (!response.ok) throw new Error("Errore nel caricamento del file");
            pubData = await response.json();
            
            const $container = $('#publications-list');
            if (!$container.length) return;

            // Puliamo il contenitore prima di riempirlo
            $container.empty();

            // Creiamo la lista degli anni unici, ordinati dal più recente al più vecchio
            const years = [...new Set(pubData.map(p => p.year))].sort((a, b) => b - a);

            years.forEach(year => {
                $container.append(`<h3 class="major">${year}</h3>`);
                let ul = $('<ul class="alt"></ul>');
                
                // Filtriamo le pubblicazioni per anno
                pubData.filter(p => p.year === year).forEach(pub => {
                    ul.append(`
                        <li class="pub-item" data-pub="${pub.id}">
                            <div class="pub-title">${pub.title}</div>
                            <p class="pub-info">
                                ${pub.authors.replace('Mattia Garatti', '<strong>Mattia Garatti</strong>')} — ${pub.journal}
                            </p>
                        </li>
                    `);
                });
                $container.append(ul);
            });
        } catch (error) {
            console.error("Errore nel caricamento del database:", error);
        }
    }

    $(document).ready(function() {
        // Avviamo l'inizializzazione
        initPublications();

        // Gestione del click sulla singola pubblicazione
        $(document).on('click', '.pub-item', function(e) {
            if ($(e.target).closest('a').length) return;

            const id = $(this).data('pub');
            const data = pubData.find(p => p.id === id); // Cerchiamo nell'array

            if (data) {
                let sourceHTML = `<strong>Source:</strong> ${data.journal} (${data.year})<br>`;
                let extraLinks = [];
                
                if(data.links.pdf && data.links.pdf !== "#") extraLinks.push(`<a href="${data.links.pdf}" target="_blank" style="color: #fff; text-decoration: underline;">[PDF]</a>`);
                if(data.links.doi && data.links.doi !== "#") extraLinks.push(`<a href="${data.links.doi}" target="_blank" style="color: #fff; text-decoration: underline;">[Publisher Site]</a>`);
                if(data.links.arxiv && data.links.arxiv !== "#") extraLinks.push(`<a href="${data.links.arxiv}" target="_blank" style="color: #fff; text-decoration: underline;">[ArXiv]</a>`);
                
                let linksHTML = extraLinks.length > 0 ? `<strong>Links:</strong> ${extraLinks.join(' — ')}` : '';

                const content = `
                    <span class="close-modal">&times;</span>
                    <h2 class="major">${data.title}</h2>
                    <p style="font-size: 0.9em; line-height: 1.8;">
                        <strong>Authors:</strong> ${data.authors}<br>
                        ${sourceHTML}
                        ${linksHTML}
                    </p>
                    <h3 class="major" style="font-size: 1em; margin-bottom: 10px;">Abstract</h3>
                    <p class="abstract-text">${data.abstract}</p>
                    <hr />
                    <h3 class="major" style="font-size: 1em; margin-bottom: 10px;">Cite (BibTeX)</h3>
                    <pre><code>${data.bibtex || "Not available"}</code></pre>
                `;

                $('#modal-body').html(content);
                $('#pubModal').fadeIn(300);
                $('body').css('overflow', 'hidden'); 
            }
        });

        // Gestione chiusura modale
        $(document).on('click', '.close-modal', function() {
            $('#pubModal').fadeOut(300);
            $('body').css('overflow', 'auto');
        });

        $(window).on('click', function(e) {
            if ($(e.target).is('#pubModal')) {
                $('#pubModal').fadeOut(300);
                $('body').css('overflow', 'auto');
            }
        });
    });
</script>
</body>
